name: Build apps

# Builds every host of the ASTRA-MED core: the shared engine bundle and CLI,
# the Windows and Linux desktop apps, and the iPad app. Desktop installers are
# attached to the run as artifacts. Nothing is published or signed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run core:build
      # The iPad app ships a copy of the bundle; it must match the engines in src/.
      - name: Core bundle in the iPad app is current
        run: git diff --exit-code ios/AstraMed/Resources/astra-core.js
      - name: CLI evaluates the example files
        run: |
          node integrations/cli/astra-core.mjs evaluate integrations/examples/day-42.csv > /dev/null
          node integrations/cli/astra-core.mjs evaluate integrations/examples/day-118.json > /dev/null || test $? -eq 3

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:prepare
      - run: npx electron-builder --projectDir desktop ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: astra-med-desktop-${{ runner.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz
          if-no-files-found: error

  ipad:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test on an iPad simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d if 'iOS' in r for x in d[r] if x['name'].startswith('iPad')))")
          xcodebuild -project ios/AstraMed.xcodeproj -scheme AstraMed -destination "platform=iOS Simulator,id=$UDID" CODE_SIGNING_ALLOWED=NO test
